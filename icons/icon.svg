<?xml version="1.0" encoding="UTF-8"?>
<!--
  嘎嘎特攻隊 / Gaga Survivor 應用圖示 (any purpose)
  主角「特工鴨」的靜態姿勢，畫法與色票直接對照 js/sprites.js 的 drawDuck()：
  身體 #ffcc00 (球面打光) / 描邊 #7d4d00、鴨嘴 #ffa940→#f06a00、墨鏡 #0b0e14 + #00e5ff、
  領帶 #ff0055、耳機 #1b222e，背景 #070a10~#1a2436 深藍，外圈霓虹環 cyan→magenta。
  修改這隻鴨子時請同步 icons/icon-maskable.svg (同畫面、縮小到安全區內)。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="嘎嘎特攻隊 特工鴨">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#1a2436"/>
      <stop offset="0.55" stop-color="#0d1420"/>
      <stop offset="1" stop-color="#070a10"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" gradientUnits="userSpaceOnUse" x1="66" y1="66" x2="446" y2="446">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.32" stop-color="#00b4d8"/>
      <stop offset="0.58" stop-color="#b5179e"/>
      <stop offset="0.85" stop-color="#ff0055"/>
      <stop offset="1" stop-color="#ff2d7a"/>
    </linearGradient>
    <filter id="neon" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 球面打光：對應 sprites.js 的 sphere() -->
    <radialGradient id="bodyGrad" gradientUnits="userSpaceOnUse"
                    cx="0" cy="0" r="16.8" fx="-6.4" fy="-7.2" fr="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="0.42" stop-color="#ffd21a"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="wingGrad" gradientUnits="userSpaceOnUse" x1="-7" y1="-5" x2="7" y2="5">
      <stop offset="0" stop-color="#ffd94a"/>
      <stop offset="1" stop-color="#dc9c00"/>
    </linearGradient>
    <linearGradient id="billGrad" gradientUnits="userSpaceOnUse" x1="8" y1="0" x2="21" y2="4">
      <stop offset="0" stop-color="#ffa940"/>
      <stop offset="1" stop-color="#f06a00"/>
    </linearGradient>
    <clipPath id="lensClip">
      <path d="M2 -10 H10 A6 6 0 0 1 16 -4 V-6.5 A6 6 0 0 1 10 -0.5 H2 A3 3 0 0 1 -1 -3.5 V-7 A3 3 0 0 1 2 -10 Z"/>
    </clipPath>
  </defs>

  <!-- 深藍底 + 霓虹環 -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="212" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="9"
          opacity="0.9" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#00e5ff" stroke-width="1"
          opacity="0.28"/>

  <!-- 特工鴨 (座標系與 js/sprites.js drawDuck 相同，整組放大 6.4 倍置中) -->
  <g id="duck-art" transform="translate(256 264) scale(6.4) translate(1.5 -1)">
    <!-- 蹼腳 -->
    <path d="M-4 14 L0 19 L-8 19 Z" fill="#e8710a" stroke="#a34600" stroke-width="1.2"/>
    <path d="M2 14 L6 19 L-2 19 Z" fill="#e8710a" stroke="#a34600" stroke-width="1.2"/>
    <!-- 尾羽 -->
    <path d="M-11 1 L-24 -7 L-19 0 L-23 4 L-12 8 Z" fill="#dda000" stroke="#8a5600" stroke-width="1.4"/>
    <!-- 身體 -->
    <circle r="16" fill="url(#bodyGrad)" stroke="#7d4d00" stroke-width="2"/>
    <!-- 腹部亮面 -->
    <ellipse cx="-1" cy="6" rx="9" ry="6" fill="#fff7be" opacity="0.5"/>
    <!-- 羽毛紋理 -->
    <path d="M-1.05 -1.39 A6 6 0 0 1 -2.27 6.7" fill="none" stroke="#8a5600" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M-1.05 2.11 A6 6 0 0 1 -2.27 10.2" fill="none" stroke="#8a5600" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M-1.05 5.61 A6 6 0 0 1 -2.27 13.7" fill="none" stroke="#8a5600" stroke-opacity="0.28" stroke-width="1"/>
    <!-- 翅膀 -->
    <g transform="translate(-3 4) rotate(-20.05)">
      <ellipse rx="8" ry="5.5" fill="url(#wingGrad)" stroke="#7d4d00" stroke-width="1.3"/>
      <path d="M-5 -2 L6 -2.4 M-5 0 L6 0 M-5 2 L6 2.4" fill="none"
            stroke="#7d4d00" stroke-opacity="0.5" stroke-width="0.9"/>
    </g>
    <!-- 鴨嘴 -->
    <path d="M7 -2 L21 1 L21 3 L7 8 Z" fill="url(#billGrad)" stroke="#a34600" stroke-width="1.4"/>
    <path d="M8 3.4 L20.5 2.2" fill="none" stroke="#8c3c00" stroke-opacity="0.75" stroke-width="1.2"/>
    <!-- 特工耳機 -->
    <circle cx="-9" cy="-5" r="3.2" fill="#1b222e"/>
    <circle cx="-9" cy="-5" r="1.2" fill="#00e5ff"/>
    <!-- 墨鏡 + 鏡片反光 -->
    <path d="M2 -10 H10 A6 6 0 0 1 16 -4 V-6.5 A6 6 0 0 1 10 -0.5 H2 A3 3 0 0 1 -1 -3.5 V-7 A3 3 0 0 1 2 -10 Z"
          fill="#0b0e14" stroke="#00e5ff" stroke-opacity="0.65" stroke-width="1"/>
    <g clip-path="url(#lensClip)">
      <path d="M2 -11 L7 1" fill="none" stroke="#a0f0ff" stroke-opacity="0.85" stroke-width="2.2"/>
      <path d="M7 -11 L11 1" fill="none" stroke="#a0f0ff" stroke-opacity="0.45" stroke-width="1.2"/>
    </g>
    <!-- 鏡腳 -->
    <path d="M-1 -6 L-9 -5.5" fill="none" stroke="#0b0e14" stroke-width="2"/>
    <!-- 西裝領 + 領帶 -->
    <path d="M-6 7 L6 7 L3 12 L-4 11 Z" fill="#141b26"/>
    <path d="M-1 8 L4 8 L1.5 12 Z" fill="#ff0055"/>
    <path d="M0 12 L3.5 12 L3 18 L1.5 20 L0 18 Z" fill="#c40040"/>
  </g>
</svg>
